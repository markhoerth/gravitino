# Default catalog-level properties for the Elasticsearch catalog. Values set on
# an individual catalog override anything declared here.

# Comma separated cluster endpoints, each with an explicit scheme. Required, and
# normally set per catalog rather than here.
# elasticsearch.hosts = https://es.example.svc:9200

# Base64 encoded id:key, sent as an Authorization: ApiKey header. Mutually
# exclusive with elasticsearch.username.
# elasticsearch.api-key =

# Basic auth credentials, as an alternative to an API key.
# elasticsearch.username =
# elasticsearch.password =

# Connect timeout in milliseconds.
elasticsearch.connect-timeout-ms = 5000

# Socket timeout in milliseconds.
elasticsearch.socket-timeout-ms = 30000

# Whether indices whose name starts with a dot are surfaced as tables. These are
# Elasticsearch's own bookkeeping rather than anything a user modeled.
elasticsearch.include-system-indices = false

# Whether TLS certificate and hostname verification is skipped. Intended for
# clusters presenting a self signed certificate.
elasticsearch.tls.skip-verify = false
