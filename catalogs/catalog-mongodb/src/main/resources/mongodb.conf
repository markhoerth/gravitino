# Default catalog-level properties for the MongoDB catalog. Values set on an
# individual catalog override anything declared here.

# Where column definitions come from: validator, sample, or validator-then-sample.
mongodb.schema-inference-mode = validator-then-sample

# Number of documents drawn by $sample when falling back to inference.
mongodb.schema-sample-size = 1000

# Behavior when sampling observes incompatible types for one field path:
# widen-to-string, external-type, or fail.
mongodb.schema-conflict-policy = widen-to-string

# BSON Decimal128 carries no declared scale, so one must be chosen.
mongodb.decimal128-scale = 8

# Maximum depth of nested documents mapped to struct types before falling back
# to string.
mongodb.schema-max-nesting-depth = 8

# Whether validators generated by Gravitino permit fields outside the declared
# column list.
mongodb.allow-additional-properties = true
